databases:
  - name: bdayreminder-db
    plan: free
    databaseName: bdayreminder
    user: bdayreminder
    postgresMajorVersion: "16"

services:
  - type: web
    name: bdayreminder
    runtime: elixir
    plan: free
    autoDeploy: true
    healthCheckPath: /
    buildCommand: ./build.sh
    startCommand: _build/prod/rel/bdayreminder/bin/server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bdayreminder-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: POOL_SIZE
        value: "10"
      - key: ELIXIR_VERSION
        value: "1.18.3"
      - key: ERLANG_VERSION
        value: "27.3"
